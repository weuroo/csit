<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Paojai Activation Center</title>
<style>
:root{--bg:#061019;--panel:#0b1722;--line:#203447;--text:#f5f8fb;--muted:#90a3b7;--cyan:#2ed5e6;--green:#42dfa0;--yellow:#f4c45b;--red:#ff7482}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;background:#061019f2;border-bottom:1px solid var(--line);z-index:5}.topin,.wrap{max-width:1280px;margin:auto;padding:14px 16px}.topin{display:flex;align-items:center;gap:10px}.brand{font-weight:900}.brand b{color:var(--cyan)}.sp{flex:1}.btn{border:1px solid var(--line);background:#102130;color:white;border-radius:11px;padding:8px 11px;text-decoration:none}.notice,.card,.mission{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.notice{margin-bottom:12px}.notice.warn{border-left:4px solid var(--yellow)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.card .n{font-size:28px;font-weight:900}.card .l{font-size:11px;color:var(--muted);margin-top:4px}.section{margin-top:14px}.section h2{font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mission h3{margin:0 0 8px;font-size:14px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.badge{display:inline-flex;border:1px solid #36516a;border-radius:99px;padding:4px 8px;font-size:10px}.green{color:#b7ffda;border-color:#2a644d}.yellow{color:#ffe2a0;border-color:#6b572c}.red{color:#ffb8c0;border-color:#6d3440}.muted{color:var(--muted);font-size:11px;line-height:1.5}.next{margin-top:9px;font-size:12px;line-height:1.5}.empty{color:var(--muted);padding:18px 0}.foot{color:var(--muted);font-size:10px;margin:20px 0}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><b>Paojai</b> Activation Center</div><div class="sp"></div><a class="btn" href="/">Mission Control</a><button class="btn" id="refresh">รีเฟรช</button></div></header>
<main class="wrap">
<div id="mode" class="notice warn">กำลังตรวจโหมด...</div>
<div id="summary" class="summary"></div>
<section class="section"><h2>สถานะ Operational Truth</h2><div id="missions" class="grid"></div></section>
<section class="section"><h2>Reusable Verified Outputs</h2><div id="outputs" class="grid"></div></section>
<div class="foot">READ ONLY · Owner-authenticated on canonical production origin · No production action authority</div>
</main>
<script>
const CANONICAL='paojai-mission-control-hub.vercel.app';
const DATA='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/pm-mission-activation-center-data-v1';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fixture={preview:true,summary:{total:4,usable:1,approval_required:1,production_live:0},missions:[{title:'Verified reusable artifact example',operational_state:'VERIFIED_ARTIFACT_RESTRICTED',usable_now_within_scope:true,production_live:false,human_approval_required_for_next_activation:false,next_best_action:'Reuse only inside recorded truth boundary',truth_boundary:'PREVIEW_FIXTURE_ONLY'},{title:'Verified capability currently inactive example',operational_state:'VERIFIED_INACTIVE',usable_now_within_scope:false,production_live:false,human_approval_required_for_next_activation:true,next_best_action:'Owner-authenticated bounded reactivation required',truth_boundary:null},{title:'Integration gap example',operational_state:'INTEGRATION_GAP',usable_now_within_scope:false,production_live:false,human_approval_required_for_next_activation:false,next_best_action:'Resolve integration evidence gap',truth_boundary:null},{title:'Completion needs operational evidence example',operational_state:'COMPLETION_NEEDS_OPERATIONAL_EVIDENCE',usable_now_within_scope:false,production_live:false,human_approval_required_for_next_activation:false,next_best_action:'Collect direct operational evidence',truth_boundary:null}],reusable_outputs:[]};
function badge(s){const c=s==='VERIFIED_ARTIFACT_RESTRICTED'?'green':s==='VERIFIED_INACTIVE'?'yellow':s==='INTEGRATION_GAP'?'red':'yellow';return `<span class="badge ${c}">${esc(s)}</span>`}
function render(d){const ms=d.missions||[],os=d.reusable_outputs||[],sm=d.summary||{};$('#summary').innerHTML=`<div class="card"><div class="n">${esc(sm.total??ms.length)}</div><div class="l">Mission ที่ตรวจแล้ว</div></div><div class="card"><div class="n">${esc(sm.usable??ms.filter(x=>x.usable_now_within_scope).length)}</div><div class="l">ใช้ต่อได้ในขอบเขต</div></div><div class="card"><div class="n">${esc(sm.approval_required??ms.filter(x=>x.human_approval_required_for_next_activation).length)}</div><div class="l">ต้อง Human Gate</div></div><div class="card"><div class="n">${esc(sm.production_live??ms.filter(x=>x.production_live).length)}</div><div class="l">Production Live</div></div>`;$('#missions').innerHTML=ms.length?ms.map(m=>`<article class="mission"><h3>${esc(m.title||m.mission_key)}</h3><div class="meta">${badge(m.operational_state)}${m.human_approval_required_for_next_activation?'<span class="badge red">Human Gate</span>':''}${m.usable_now_within_scope?'<span class="badge green">Usable in scope</span>':''}</div><div class="muted">Truth boundary: ${esc(m.truth_boundary||'—')}<br>Production live: ${m.production_live?'YES':'NO'}</div><div class="next"><b>Next:</b> ${esc(m.next_best_action||'—')}</div></article>`).join(''):'<div class="empty">ไม่มีข้อมูล</div>';$('#outputs').innerHTML=os.length?os.map(o=>`<article class="mission"><h3>${esc(o.title||o.mission_key)}</h3><div class="meta"><span class="badge green">Verified output</span></div><div class="muted">${esc(o.path||'—')}<br>${esc(o.truth_boundary||'—')}</div><div class="next">${esc(o.reuse_policy||'READ ONLY')}</div></article>`).join(''):'<div class="empty">Preview ไม่แสดง internal reusable outputs</div>'}
async function load(){if(location.hostname!==CANONICAL){$('#mode').textContent='ISOLATED PREVIEW — ใช้ข้อมูล fixture เท่านั้น ไม่มี Live/Internal Data และไม่มี Authority';render(fixture);return}const t=sessionStorage.getItem('pm_owner_mission_session')||'';if(!t){$('#mode').textContent='ต้องยืนยัน Owner Session ที่ Mission Control ก่อน';setTimeout(()=>location.assign('/'),900);return}$('#mode').textContent='LIVE READ-ONLY — Owner session verified at backend; no action authority';try{const r=await fetch(DATA,{headers:{authorization:'Bearer '+t},cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('pm_owner_mission_session');location.assign('/');return}if(!r.ok||d?.ok===false)throw new Error(d?.error||`HTTP_${r.status}`);render(d)}catch(e){$('#mode').textContent='Activation backend ยังไม่ promoted หรืออ่านไม่ได้: '+(e?.message||String(e));render({summary:{},missions:[],reusable_outputs:[]})}}
$('#refresh').onclick=load;load();
</script>
</body></html>
