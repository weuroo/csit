<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Paojai Mission Control</title>
<style>
:root{--bg:#071019;--panel:#0d1823;--panel2:#111f2c;--line:#203245;--text:#f6f8fb;--muted:#8ea0b3;--cyan:#19e5d1;--green:#2be68c;--yellow:#ffca5c;--red:#ff6b7a;--blue:#78a8ff;--shadow:0 18px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 30% -10%,#132a3d 0,transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(7,16,25,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.topin{max-width:1500px;margin:auto;padding:14px 18px;display:flex;gap:14px;align-items:center}.brand{font-weight:850;letter-spacing:.3px;white-space:nowrap}.brand b{color:var(--cyan)}.live{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:99px;background:var(--green);box-shadow:0 0 16px var(--green)}button,input{font:inherit}.btn{border:1px solid var(--line);background:#10202e;color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}.btn:hover{border-color:#3c5874}.shell{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 94px);overflow:auto;padding-right:3px}.overview{background:linear-gradient(145deg,#0e1b28,#0a1721);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);margin-bottom:13px}.overview h2{font-size:15px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#07131d;border:1px solid #1a3042;border-radius:11px;padding:10px}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted)}.search{width:100%;margin:12px 0;background:#07131d;border:1px solid var(--line);border-radius:11px;color:white;padding:11px 12px;outline:none}.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.filter button{font-size:11px;padding:6px 9px}.filter button.active{background:var(--cyan);color:#05211e;border-color:var(--cyan);font-weight:800}.missions{display:flex;flex-direction:column;gap:8px}.mnav{width:100%;text-align:left;background:#0c1823;border:1px solid #1b2d3e;color:white;border-radius:13px;padding:12px;cursor:pointer}.mnav.active{border-color:var(--cyan);box-shadow:inset 3px 0 var(--cyan)}.mnav .row{display:flex;align-items:center;gap:8px}.mnav .title{font-size:13px;font-weight:750;line-height:1.3;flex:1}.mnav .mini{font-size:11px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between}.bar{height:5px;background:#20303d;border-radius:99px;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#14d8c6,#61f0b6);border-radius:99px}.main{min-width:0}.hero{background:linear-gradient(135deg,#102232,#091620);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}.herohead{display:flex;gap:12px;align-items:flex-start}.hero h1{font-size:clamp(24px,4vw,40px);margin:0 0 6px;line-height:1.12}.key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:11px;word-break:break-all}.badge{display:inline-flex;align-items:center;border:1px solid #274157;background:#112131;border-radius:99px;padding:5px 9px;font-size:11px;color:#c8d5e2;white-space:nowrap}.badge.green{color:#a9ffd1;border-color:#235f45}.badge.yellow{color:#ffe29a;border-color:#665229}.badge.red{color:#ffb4bb;border-color:#65333a}.heroGrid{display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}.metric{background:#07131d;border:1px solid #1d3142;border-radius:14px;padding:13px}.metric .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.metric .v{font-size:16px;font-weight:800;margin-top:6px;word-break:break-word}.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) calc(var(--p)*1%),#22323f 0);position:relative;margin:auto}.ring:after{content:"";position:absolute;width:88px;height:88px;border-radius:50%;background:#07131d}.ring span{z-index:1;font-size:26px;font-weight:900}.block{background:#0b1823;border:1px solid #213546;border-radius:15px;padding:16px;margin-bottom:12px}.block h3{font-size:13px;color:#c2cfdb;margin:0 0 9px;text-transform:uppercase;letter-spacing:.45px}.block p{margin:0;line-height:1.55}.next{border-left:3px solid var(--cyan)}.blocker{border-left:3px solid var(--yellow)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.smallcard{background:#07131d;border:1px solid #1d3142;border-radius:12px;padding:12px}.smallcard b{font-size:13px}.smallcard p{color:var(--muted);font-size:11px;margin:5px 0 0;line-height:1.5}.contract{border-top:1px solid #1d3142;padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.contract:first-child{border-top:0}.contract .ct{font-size:12px;font-weight:700}.contract .meta{font-size:10px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);font-size:12px;padding:12px 0}.criteria pre{white-space:pre-wrap;word-break:break-word;background:#07131d;border:1px solid #1d3142;border-radius:12px;padding:12px;color:#bcd0df;font-size:11px;line-height:1.55}.login{position:fixed;inset:0;background:rgba(2,8,13,.82);backdrop-filter:blur(12px);z-index:100;display:grid;place-items:center;padding:20px}.login.hidden{display:none}.loginbox{width:min(430px,100%);background:#0e1a25;border:1px solid #294258;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.loginbox h2{margin:0 0 8px}.loginbox p{color:var(--muted);font-size:12px;line-height:1.5}.loginbox input{width:100%;background:#07131d;border:1px solid #294258;border-radius:11px;color:white;padding:12px;margin:8px 0 10px}.error{color:#ff9ba5;font-size:12px;min-height:18px}.footer{color:#607486;font-size:10px;text-align:center;padding:24px}.mobileTabs{display:none}
@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;max-height:none;padding:0}.overview{margin-bottom:10px}.missions{display:none}.mobileTabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.mnav{min-width:220px}.heroGrid{grid-template-columns:150px 1fr 1fr}.heroGrid .metric:last-child{grid-column:2/4}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.topin{padding:11px 12px}.shell{padding:12px}.live span{display:none}.hero{padding:16px}.herohead{display:block}.hero .badge{margin-top:10px}.heroGrid{grid-template-columns:1fr 1fr}.ringbox{grid-column:1/3}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="login" id="login"><div class="loginbox"><h2>Mission Control</h2><p>ใช้ Read-only Monitor Token เดียวกับระบบติดตามเดิม Token จะเก็บเฉพาะใน session ของ browser นี้และไม่ฝังในหน้าเว็บ</p><input id="token" type="password" autocomplete="off" placeholder="Read-only monitor token"/><button class="btn" id="loginBtn">เปิด Mission Control</button><div class="error" id="loginErr"></div></div></div>
<div class="app">
<header class="top"><div class="topin"><div class="brand"><b>Paojai</b> Mission Control</div><button class="btn" id="allBtn">ทุกภารกิจ</button><div class="live"><i class="dot"></i><span id="clock">กำลังเชื่อมต่อ...</span></div><button class="btn" id="refresh">รีเฟรช</button></div></header>
<div class="shell">
<aside class="side"><div class="overview"><h2>ภาพรวมภารกิจ</h2><div class="stats" id="stats"></div><input class="search" id="search" placeholder="ค้นหาภารกิจ..."/><div class="filter" id="filter"><button class="btn active" data-f="ALL">ทั้งหมด</button><button class="btn" data-f="ACTIVE">กำลังทำ</button><button class="btn" data-f="BLOCKED">ติดบล็อก</button><button class="btn" data-f="WAIT">รอหลักฐาน</button></div><div class="mobileTabs" id="mobileTabs"></div></div><div class="missions" id="missions"></div></aside>
<main class="main" id="main"><div class="hero"><h1>กำลังโหลดข้อมูล...</h1></div></main>
</div><div class="footer">Read-only Mission Intelligence · Existing dashboards remain untouched</div></div>
<script>
const API='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/pm-mission-control-data';let data=null,selected=null,filter='ALL',query='';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=s=>s?new Date(s).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'—';
function badge(m){if(m.status==='BLOCKED'||m.problem_state==='BLOCKED')return '<span class="badge red">ติดบล็อก</span>';if(m.problem_state==='EVIDENCE_WAIT'||m.problem_state==='WAITING_HUMAN')return '<span class="badge yellow">รอหลักฐาน</span>';if(m.outcome_verified)return '<span class="badge green">ยืนยันผลแล้ว</span>';return '<span class="badge green">กำลังดำเนินการ</span>'}
function visible(m){const qok=!query||(`${m.title} ${m.mission_key}`.toLowerCase().includes(query));if(!qok)return false;if(filter==='ACTIVE')return m.status==='ACTIVE'&&!['EVIDENCE_WAIT','WAITING_HUMAN'].includes(m.problem_state);if(filter==='BLOCKED')return m.status==='BLOCKED'||m.problem_state==='BLOCKED';if(filter==='WAIT')return ['EVIDENCE_WAIT','WAITING_HUMAN'].includes(m.problem_state);return true}
function renderNav(){const arr=data.missions.filter(visible);const html=arr.map(m=>`<button class="mnav ${selected===m.mission_key?'active':''}" data-key="${esc(m.mission_key)}"><div class="row"><div class="title">${esc(m.title)}</div>${badge(m)}</div><div class="bar"><div class="fill" style="width:${m.progress_pct}%"></div></div><div class="mini"><span>${esc(m.display_state_th)}</span><b>${m.progress_pct}%</b></div></button>`).join('')||'<div class="empty">ไม่พบภารกิจ</div>';$('#missions').innerHTML=html;$('#mobileTabs').innerHTML=html;document.querySelectorAll('.mnav').forEach(b=>b.onclick=()=>select(b.dataset.key));}
function renderStats(){const s=data.summary;$('#stats').innerHTML=`<div class="stat"><b>${s.total}</b><span>ทั้งหมด</span></div><div class="stat"><b>${s.active}</b><span>ACTIVE</span></div><div class="stat"><b>${s.avg_progress_pct}%</b><span>เฉลี่ย</span></div>`}
function missionCard(m){const owners=m.active_agents?.length?m.active_agents.map(a=>`<span class="badge">${esc(a.display_name)}</span>`).join(' '):'<span class="empty">ไม่มี Open Contract — Agent อยู่ Watch/Standby ตามบทบาท</span>';const contracts=m.contracts.items?.slice(0,8).map(c=>`<div class="contract"><div><div class="ct">${esc(c.assigned_by_display)} → ${esc(c.assigned_to_display)} · ${esc(c.contract_type)}</div><div class="meta">#${c.contract_id} · ${esc(c.expected_result_type||'—')} · เปิด ${dt(c.opened_at)}</div></div><span class="badge ${c.status==='OPEN'?'green':c.status==='OVERDUE'?'red':''}">${esc(c.status)}</span></div>`).join('')||'<div class="empty">ยังไม่มี contract ที่เชื่อมกับภารกิจนี้</div>';return `<section id="${esc(m.mission_key)}"><div class="hero"><div class="herohead"><div style="flex:1"><div class="key">${esc(m.mission_key)}</div><h1>${esc(m.title)}</h1><div>${badge(m)} <span class="badge">${esc(m.mission_type)}</span> <span class="badge">Risk ${esc(m.risk_class)}</span></div></div></div><div class="heroGrid"><div class="metric ringbox"><div class="ring" style="--p:${m.progress_pct}"><span>${m.progress_pct}%</span></div></div><div class="metric"><div class="k">Stage / State</div><div class="v">${esc(m.phase||m.display_state_th)}</div></div><div class="metric"><div class="k">Open Contracts</div><div class="v">${m.contracts.open}</div></div><div class="metric"><div class="k">Last Evidence</div><div class="v">${dt(m.last_event_at||m.last_run_at)}</div></div></div></div><div class="block next"><h3>Next Best Action</h3><p>${esc(m.next_action||'ยังไม่มี Next Action')}</p></div><div class="block blocker"><h3>Current Blocker</h3><p>${esc(m.blocker||'ไม่มี blocker ที่ยืนยันได้')}</p></div><div class="grid2"><div class="block"><h3>AI ที่กำลังถือ Contract</h3><div>${owners}</div></div><div class="block"><h3>Evidence Status</h3><p>${m.outcome_verified?'Verified Outcome แล้ว':'ยังไม่ปิด Verified Outcome'} · Human Approval: ${m.requires_human_approval?'ต้องใช้':'ยังไม่ต้องใช้'}<br>อัปเดต Mission: ${dt(m.updated_at)}</p></div></div><div class="block"><h3>Work Contracts ล่าสุด</h3>${contracts}</div><div class="block criteria"><h3>Success Criteria / Mission Definition</h3><pre>${esc(JSON.stringify(m.success_criteria,null,2))}</pre></div></section>`}
function renderMain(){if(!data)return;if(selected){const m=data.missions.find(x=>x.mission_key===selected);$('#main').innerHTML=m?missionCard(m):'<div class="hero"><h1>ไม่พบภารกิจ</h1></div>';location.hash=selected;}else{$('#main').innerHTML=`<div class="hero"><div class="key">ALL MISSIONS · LIVE PRODUCTION</div><h1>Mission Portfolio</h1><p style="color:var(--muted);line-height:1.6">ภารกิจปัจจุบันและอนาคตทั้งหมดจะปรากฏอัตโนมัติจาก Production แต่ละภารกิจมีพื้นที่ของตัวเองด้านล่าง</p></div>`+data.missions.filter(visible).map(m=>missionCard(m)).join('');history.replaceState(null,'',location.pathname+location.search);}}
function select(k){selected=k;renderNav();renderMain();window.scrollTo({top:0,behavior:'smooth'})}
async function load(){const token=sessionStorage.getItem('pmMissionToken');if(!token){$('#login').classList.remove('hidden');return}try{const r=await fetch(`${API}?t=${encodeURIComponent(token)}`,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'โหลดข้อมูลไม่สำเร็จ');data=j;$('#login').classList.add('hidden');$('#clock').textContent=`Source ${dt(j.server_time)} · Auto 20s`;renderStats();if(!selected&&location.hash){const k=decodeURIComponent(location.hash.slice(1));if(j.missions.some(m=>m.mission_key===k))selected=k}renderNav();renderMain()}catch(e){sessionStorage.removeItem('pmMissionToken');$('#login').classList.remove('hidden');$('#loginErr').textContent='Token ไม่ถูกต้องหรือหมดอายุ';}}
$('#loginBtn').onclick=()=>{const t=$('#token').value.trim();if(!t)return;sessionStorage.setItem('pmMissionToken',t);$('#loginErr').textContent='';load()};$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});$('#refresh').onclick=load;$('#allBtn').onclick=()=>{selected=null;renderNav();renderMain();window.scrollTo({top:0,behavior:'smooth'})};$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderNav();if(!selected)renderMain()};document.querySelectorAll('#filter button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('#filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderNav();if(!selected)renderMain()});load();setInterval(()=>{if(sessionStorage.getItem('pmMissionToken'))load()},20000);
</script>
</body></html>
