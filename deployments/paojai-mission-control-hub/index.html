<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Paojai Mission Control</title><style>
:root{--bg:#071019;--panel:#0d1823;--line:#203245;--text:#f5f8fb;--muted:#8fa1b4;--cyan:#24d6e8;--green:#34e59a;--yellow:#f5bf4c;--red:#ff6f7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:20;background:#071019e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;gap:10px;align-items:center}.brand{font-weight:850}.brand b{color:var(--cyan)}.top .sp{flex:1}.btn{border:1px solid var(--line);background:#10202e;color:white;border-radius:11px;padding:9px 12px;font:inherit}.shell{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:320px 1fr;gap:16px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px}.panel{padding:14px;position:sticky;top:70px;align-self:start;max-height:calc(100vh - 85px);overflow:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#08141e;border:1px solid #1c3142;border-radius:11px;padding:9px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:10px}.nav{display:flex;flex-direction:column;gap:8px;margin-top:12px}.m{background:#0a1722;border:1px solid #1c3142;border-radius:12px;padding:11px;color:white;text-align:left}.m.active{border-color:var(--cyan)}.mt{font-size:13px;font-weight:750}.bar{height:5px;background:#20313f;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--cyan)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:6px}.card{padding:18px;margin-bottom:12px}.hero h1{font-size:clamp(25px,4vw,38px);margin:6px 0 10px}.key{font:11px ui-monospace,SFMono-Regular,monospace;color:var(--muted);word-break:break-all}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{border:1px solid #294258;border-radius:99px;padding:5px 8px;font-size:11px}.green{color:#aaffd0}.yellow{color:#ffe09b}.red{color:#ffb1b8}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.metric{background:#08141e;border:1px solid #1c3142;border-radius:12px;padding:11px}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{display:block;font-size:18px;margin-top:5px}.block{border-left:3px solid var(--cyan)}.block.warn{border-left-color:var(--yellow)}.block h3{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase}.block p{margin:0;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contract{border-top:1px solid #1d3142;padding:10px 0}.contract:first-child{border-top:0}.muted{color:var(--muted);font-size:12px}.login{position:fixed;inset:0;background:#040b11ed;z-index:100;display:grid;place-items:center;padding:20px}.login.hide{display:none}.loginbox{width:min(430px,100%);background:#0d1a25;border:1px solid #294258;border-radius:20px;padding:22px}.loginbox h2{font-size:30px;margin:0 0 8px}.loginbox p{color:var(--muted);line-height:1.55}.authbtn{width:100%;min-height:56px;margin-top:10px;background:#eef7ff;color:#07111f;border:0;border-radius:15px;font-size:17px;font-weight:850}.err{color:#ff9fa9;margin-top:12px;font-size:12px;min-height:18px}.live{font-size:11px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:#08141e;border:1px solid #1c3142;border-radius:11px;padding:11px;color:#bcd0df;font-size:11px}
@media(max-width:850px){.shell{grid-template-columns:1fr}.panel{position:static;max-height:none}.nav{flex-direction:row;overflow:auto}.m{min-width:220px}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.top{padding:10px 12px}.shell{padding:12px}.metrics{grid-template-columns:1fr 1fr}.hero h1{font-size:27px}}
</style></head>
<body>
<div class="login" id="login"><div class="loginbox"><h2>Mission Control</h2><p>ยืนยันตัวตนด้วย Owner Passkey / Face ID เพื่อเข้าโหมดอ่านอย่างเดียว ไม่มีสิทธิ์แก้ไข Production</p><button class="authbtn" id="authBtn">ยืนยันด้วย Face ID</button><div class="err" id="authErr"></div></div></div>
<header class="top"><div class="brand"><b>Paojai</b> Mission Control</div><div class="sp"></div><div class="live" id="clock">—</div><button class="btn" id="refresh">รีเฟรช</button><button class="btn" id="logout">ออก</button></header>
<div class="shell"><aside class="panel"><div class="stats" id="stats"></div><div class="nav" id="nav"></div></aside><main id="main"><div class="card">กำลังรอ Owner Authentication…</div></main></div>
<script>
const DATA='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/pm-mission-control-data-v2';
const AUTH='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/pm-owner-mission-auth';
let data=null,selected=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const dt=s=>s?new Date(s).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'—';
function token(){return sessionStorage.getItem('pm_owner_mission_session')||''}function badge(m){if(m.status==='BLOCKED'||m.problem_state==='BLOCKED')return '<span class="badge red">ติดบล็อก</span>';if(['EVIDENCE_WAIT','WAITING_HUMAN'].includes(m.problem_state))return '<span class="badge yellow">รอหลักฐาน</span>';if(m.outcome_verified)return '<span class="badge green">ยืนยันผลแล้ว</span>';return '<span class="badge green">กำลังดำเนินการ</span>'}
async function post(body){const r=await fetch(AUTH,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d?.ok===false)throw new Error(d?.error||`HTTP_${r.status}`);return d}
async function beginAuth(){try{$('#authBtn').disabled=true;$('#authErr').textContent='กำลังเตรียม Owner Authentication…';const d=await post({action:'start'});location.assign(d.authUrl)}catch(e){$('#authBtn').disabled=false;$('#authErr').textContent='ไม่สำเร็จ: '+(e?.message||String(e))}}
async function exchangeIfNeeded(){const q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state');if(!code||!state)return false;try{const d=await post({action:'exchange',code,state});sessionStorage.setItem('pm_owner_mission_session',d.sessionToken);history.replaceState({},'',location.pathname+location.hash);return true}catch(e){history.replaceState({},'',location.pathname);$('#authErr').textContent='แลก Owner Session ไม่สำเร็จ: '+(e?.message||String(e));return false}}
async function load(){const t=token();if(!t){$('#login').classList.remove('hide');return}try{const r=await fetch(DATA,{headers:{authorization:'Bearer '+t}});const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('pm_owner_mission_session');$('#login').classList.remove('hide');throw new Error('Owner Session หมดอายุ กรุณายืนยันใหม่')}if(!r.ok||!d.ok)throw new Error(d.error||`HTTP_${r.status}`);data=d;$('#login').classList.add('hide');$('#clock').textContent='Live · '+new Date(d.server_time).toLocaleTimeString('th-TH');render()}catch(e){$('#authErr').textContent=e?.message||String(e)}}
function render(){const s=data.summary;$('#stats').innerHTML=`<div class="stat"><b>${s.total}</b><span>ทั้งหมด</span></div><div class="stat"><b>${s.active}</b><span>ACTIVE</span></div><div class="stat"><b>${s.avg_progress_pct}%</b><span>เฉลี่ย</span></div>`;if(!selected||!data.missions.some(m=>m.mission_key===selected))selected=location.hash.slice(1)||data.missions[0]?.mission_key;$('#nav').innerHTML=data.missions.map(m=>`<button class="m ${selected===m.mission_key?'active':''}" data-k="${esc(m.mission_key)}"><div class="mt">${esc(m.title)}</div><div class="bar"><div class="fill" style="width:${m.progress_pct}%"></div></div><div class="meta"><span>${esc(m.display_state_th)}</span><b>${m.progress_pct}%</b></div></button>`).join('');document.querySelectorAll('.m').forEach(b=>b.onclick=()=>{selected=b.dataset.k;location.hash=selected;render()});const m=data.missions.find(x=>x.mission_key===selected)||data.missions[0];if(!m)return;const owners=m.active_agents?.length?m.active_agents.map(a=>`<span class="badge">${esc(a.display_name)}</span>`).join(' '):'<span class="muted">ไม่มี Open Contract — Watch/Standby ตามบทบาท</span>';const contracts=m.contracts.items?.slice(0,10).map(c=>`<div class="contract"><b>${esc(c.assigned_by_display)} → ${esc(c.assigned_to_display)}</b><div class="muted">#${c.contract_id} · ${esc(c.contract_type)} · ${esc(c.status)} · ${dt(c.opened_at)}</div></div>`).join('')||'<div class="muted">ไม่มี contract ที่เชื่อมอยู่</div>';$('#main').innerHTML=`<section class="card hero"><div class="key">${esc(m.mission_key)}</div><h1>${esc(m.title)}</h1><div class="badges">${badge(m)}<span class="badge">${esc(m.mission_type)}</span><span class="badge">Risk ${esc(m.risk_class)}</span></div><div class="metrics"><div class="metric"><small>Progress</small><b>${m.progress_pct}%</b></div><div class="metric"><small>Stage</small><b>${esc(m.phase||m.display_state_th)}</b></div><div class="metric"><small>Open Contracts</small><b>${m.contracts.open}</b></div><div class="metric"><small>Last Evidence</small><b>${dt(m.last_event_at||m.last_run_at)}</b></div></div></section><section class="card block"><h3>Next Best Action</h3><p>${esc(m.next_action||'ยังไม่มี Next Action')}</p></section>${m.blocker?`<section class="card block warn"><h3>Current Blocker</h3><p>${esc(m.blocker)}</p></section>`:''}<div class="grid"><section class="card"><h3>AI Responsibility</h3><div>${owners}</div></section><section class="card"><h3>Contracts</h3>${contracts}</section></div><section class="card"><h3>Success Criteria</h3><pre>${esc(JSON.stringify(m.success_criteria||{},null,2))}</pre></section>`}
$('#authBtn').onclick=beginAuth;$('#refresh').onclick=load;$('#logout').onclick=()=>{sessionStorage.removeItem('pm_owner_mission_session');location.replace(location.pathname)};window.addEventListener('hashchange',()=>{selected=location.hash.slice(1);if(data)render()});
(async()=>{await exchangeIfNeeded();await load();setInterval(()=>{if(token())load()},20000)})();
</script></body></html>
