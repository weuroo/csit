function pulse(t,k='INFO',ms=now()){pulses.unshift({t,k,ms});pulses=pulses.slice(0,30);$('#pulseFeed').innerHTML=pulses.map(x=>'<div class="pi"><time>'+fmt(x.ms)+'</time> · <b>'+esc(x.k)+'</b><br>'+esc(x.t)+'</div>').join('')}function clock(){let ms=now(),p=parts(ms),h=+p.hour,night=h<6||h>=19,start=Date.parse('2026-08-17T00:00:00+07:00'),day=Math.max(1,Math.floor((ms-start)/864e5)+1);$('#clock').textContent=p.hour+':'+p.minute+' '+(night?'🌙':h<11?'☀️':h<17?'🌤️':'🌆');$('#day').textContent='DAY '+day+' · Bangkok '+(speed===1?'sync':'simulation');$('#world').classList.toggle('night',night)}
function apply(){$('#stage').style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;$('#world').classList.toggle('far',cam.s<.72)}function fit(){let r=$('#view').getBoundingClientRect();cam.s=Math.min(r.width/1000,r.height/1000)*1.04;cam.x=(r.width-1000*cam.s)/2;cam.y=(r.height-1000*cam.s)/2;apply()}function zoom(f,x,y){let r=$('#view').getBoundingClientRect(),px=x??r.width/2,py=y??r.height/2,wx=(px-cam.x)/cam.s,wy=(py-cam.y)/cam.s,ns=clamp(cam.s*f,.35,3.4);cam.x=px-wx*ns;cam.y=py-wy*ns;cam.s=ns;apply()}function focus(x,y,z=1.4){let r=$('#view').getBoundingClientRect();cam.s=Math.max(cam.s,z);cam.x=r.width/2-x*cam.s;cam.y=r.height/2-y*cam.s;apply()}
function open(){$('#sheetbg').classList.add('on')}function close(){sel=null;$('#sheetbg').classList.remove('on')}function rows(n){return Object.entries({energy:'⚡ Energy',social:'💬 Social',fun:'🎉 Fun',learning:'📚 Learning',focus:'🧠 Focus'}).map(([k,l])=>'<div class="need"><span>'+l+'</span><div class="bar"><i style="width:'+n[k]+'%"></i></div><b>'+n[k]+'</b></div>').join('')}function showActor(id){let a=actors.find(x=>x.id===id);if(!a)return;sel=id;focus(a.x,a.y);let f=facts(a),ev=(D.w.inner_life||[]).filter(x=>x.identity_key===a.k).slice(0,5);$('#st').textContent=(a.t==='AI'?'🤖 ':'👤 ')+a.n;$('#sm').textContent=a.t+' · 📍 '+(P.get(a.from)?.display_name_th||a.from);$('#sb').innerHTML='<div class="actions"><button id="follow" class="primary">'+(follow===id?'✓ Follow อยู่':'👁 Follow')+'</button><button id="home">🏠 บ้าน</button></div><b style="font-size:11px">Simulation Needs · DERIVED</b>'+rows(needs(a,now()))+'<div class="note"><b>FACT</b> ชื่อ/สถานที่/กิจกรรม public-safe มาจากระบบจริง<br><b>SIMULATION</b> Needs และ movement หน้านี้เป็น Shadow-only ไม่มี production effect</div><div>'+ (ev.length?ev.map(x=>'<div class="event"><b>'+esc(x.title_th||x.event_type)+'</b><br>'+esc(x.summary_th||'')+'</div>').join(''):'<div class="event">ยังไม่มี public-safe life event</div>')+'</div>';$('#follow').onclick=()=>{follow=follow===id?null:id;close()};$('#home').onclick=()=>{let h=a.t==='AI'?H.get(a.k):f.n?.home_place_key;if(P.has(h)){close();showPlace(h)}};open()}function showPlace(k){let p=P.get(k);if(!p)return;let z=pxy(p),here=actors.filter(a=>!a.route.length&&a.from===k);focus(z.x,z.y,1.25);$('#st').textContent=icon(p)+' '+(p.display_name_th||k);$('#sm').textContent=(p.place_type||'')+' · '+(p.coordinate_label||'')+' · '+(p.zone_key||'');$('#sb').innerHTML='<div class="meta">'+esc(p.purpose_th||'')+'</div><h3>ขณะนี้ '+here.length+' คนใน Shadow View</h3>'+here.map(a=>'<button class="result" data-a="'+esc(a.id)+'">'+(a.t==='AI'?'🤖':'👤')+' '+esc(a.n)+'</button>').join('')+'<div class="note">พิกัดอาคาร = public-safe fact · จำนวนคนใน Shadow View อาจรวม simulation movement</div>';$('#sb').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{close();showActor(b.dataset.a)});open()}
function search(s){s=s.trim().toLowerCase();if(!s){$('#results').classList.remove('on');return}let r=[];for(const a of actors)if((a.n+' '+a.k).toLowerCase().includes(s))r.push({t:'a',id:a.id,n:(a.t==='AI'?'🤖 ':'👤 ')+a.n,m:a.t});for(const p of P.values())if(((p.display_name_th||'')+' '+p.place_key).toLowerCase().includes(s))r.push({t:'p',id:p.place_key,n:icon(p)+' '+(p.display_name_th||p.place_key),m:p.place_type});$('#results').innerHTML=r.slice(0,22).map(x=>'<button class="result" data-t="'+x.t+'" data-id="'+esc(x.id)+'"><b>'+esc(x.n)+'</b><small>'+esc(x.m||'')+'</small></button>').join('');$('#results').classList.add('on');$('#results').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{$('#results').classList.remove('on');b.dataset.t==='a'?showActor(b.dataset.id):showPlace(b.dataset.id)})}
function regression(){let cases=0,bad=0,anchors=[...P.values()].filter(p=>['SOCIAL','LEARNING','RECOVERY','CIVIC'].includes(p.place_type)).slice(0,5);for(const a of actors.slice(0,80))for(const p of anchors)if(allowed(a,p)&&p.place_key!==a.place){cases++;let r=bfs(a.place,p.place_key);if(!r.length||new Set(r).size!==r.length)bad++}pulse('Route regression '+(bad?'BLOCK':'PASS')+' · '+cases+' cases · '+bad+' failures',bad?'BLOCK':'PASS')}
function bind(){$('#plus').onclick=()=>zoom(1.25);$('#minus').onclick=()=>zoom(.8);$('#fit').onclick=()=>{follow=null;fit()};$('#pulseBtn').onclick=()=>$('#pulse').classList.toggle('on');$('#close').onclick=close;$('#sheetbg').onclick=e=>{if(e.target===$('#sheetbg'))close()};$('#q').oninput=e=>search(e.target.value);$('#x').onclick=()=>{$('#q').value='';$('#results').classList.remove('on')};$$('[data-s]').forEach(b=>b.onclick=()=>{let n=now();epoch=Date.now();off=n-epoch;speed=+b.dataset.s;$$('[data-s]').forEach(x=>x.classList.toggle('on',x===b));pulse(speed?'Simulation speed '+speed+'×':'Simulation paused','SYSTEM')});let v=$('#view');v.onpointerdown=e=>{if(e.target.closest('button'))return;v.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY})};v.onpointermove=e=>{if(!ptr.has(e.pointerId))return;follow=null;let o=ptr.get(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});let ps=[...ptr.values()];if(ps.length===1){cam.x+=e.clientX-o.x;cam.y+=e.clientY-o.y;apply()}else if(ps.length===2){let[a,b]=ps,d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},r=v.getBoundingClientRect();if(ld)zoom(d/ld,m.x-r.left,m.y-r.top);ld=d;lm=m}};let end=e=>{ptr.delete(e.pointerId);if(ptr.size<2){ld=0;lm=null}};v.onpointerup=end;v.onpointercancel=end;v.addEventListener('wheel',e=>{e.preventDefault();let r=v.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});window.onresize=()=>{if(innerWidth<800)fit()}}
function frame(t){if(ready){clock();if(t-last>80){tick(now());last=t}if(follow){let a=actors.find(x=>x.id===follow);if(a){let r=$('#view').getBoundingClientRect();cam.s=Math.max(cam.s,1.45);cam.x=r.width/2-a.x*cam.s;cam.y=r.height/2-a.y*cam.s;apply()}}}requestAnimationFrame(frame)}async function load(){try{let[wr,cr]=await Promise.all([fetch(WA+'?days=14',{cache:'no-store'}),fetch(CA,{cache:'no-store'})]),[w,c]=await Promise.all([wr.json(),cr.json()]);if(!w.ok||!c.ok||!w.public_safe||!c.public_safe)throw 0;D={w,c};map();people();for(const e of (w.inner_life||[]).slice(0,5).reverse())pulse((e.display_name_th||e.identity_key)+' · '+(e.title_th||e.event_type),'FACT',Date.parse(e.occurred_at||new Date()));regression();fit();ready=true;pulse('Living City พร้อม · '+actors.length+' actors · '+(c.walking_edges||[]).length+' walking edges','READY')}catch(e){$('#error').classList.add('on')}}bind();requestAnimationFrame(frame);load();setInterval(()=>{if(ready)fetch(WA+'?days=14',{cache:'no-store'}).then(r=>r.json()).then(w=>{if(w.ok&&w.public_safe)D.w=w}).catch(()=>{})},3e4);
