<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf4f8"><title>Paojai City Planner</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5f2;color:#173044;font-family:ui-rounded,"SF Pro Rounded","Noto Sans Thai",system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:12px}.top,.tools,.zoomtools,.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;align-items:flex-start}.top h1{margin:0}.muted{font-size:11px;color:#688392;line-height:1.5}.btn,.select,.search{border:1px solid #cfdee4;background:#fff;color:#173044;border-radius:12px;padding:9px 11px;font:inherit}.btn{cursor:pointer}.btn.active{background:#173044;color:#fff}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}.metric,.card{background:#fff;border:1px solid #d8e6ea;border-radius:18px;padding:11px;box-shadow:0 7px 20px rgba(30,60,80,.07)}.metric b{display:block;font-size:20px}.metric span{font-size:9px;color:#6b8493}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px}.maphead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.viewport{position:relative;width:100%;height:70vh;min-height:520px;overflow:auto;border-radius:18px;background:#b9dca2;border:1px solid #bfd3c1}.map{position:relative;width:900px;height:900px;background:#a8d985}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.28) 1px,transparent 1px);background-size:10% 10%;z-index:3;pointer-events:none}.axis{position:absolute;font-size:8px;font-weight:900;color:rgba(30,70,68,.62);z-index:20;pointer-events:none}.axis.x{bottom:2px}.axis.y{left:3px}.cell{position:absolute;width:10%;height:10%;z-index:1;border:1px solid rgba(255,255,255,.16);cursor:pointer}.land-on .cell.ROAD{background:rgba(109,118,126,.48)}.land-on .cell.BUILDABLE{background:rgba(238,214,128,.20)}.land-on .cell.PARK{background:rgba(76,137,72,.34)}.land-on .cell.PRIVATE{background:rgba(131,89,128,.28)}.land-on .cell.RESERVED{background:rgba(63,91,128,.32)}.celllabel{display:none;position:absolute;left:3px;top:3px;font-size:7px;font-weight:900;padding:2px 4px;border-radius:6px;background:rgba(255,255,255,.78)}.land-on .celllabel{display:block}.pin,.cluster{position:absolute;transform:translate(-50%,-50%);z-index:10;border:0;background:transparent;cursor:pointer}.dot{display:block;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #426b8a;box-shadow:0 3px 9px rgba(20,55,66,.25)}.coord,.pname,.occ{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:8px;font-size:8px;font-weight:900}.coord{top:20px;background:#173044;color:#fff;padding:2px 5px}.pname{top:36px;background:#fff;padding:3px 5px;max-width:150px;overflow:hidden;text-overflow:ellipsis}.occ{bottom:20px;background:#fff3b0;padding:2px 5px}.cluster .bubble{display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:18px;background:#173044;color:#fff;border:3px solid #fff;font-size:11px;font-weight:900}.hide-names .pname{display:none}.hide-coords .coord{display:none}.list{max-height:75vh;overflow:auto}.row{padding:9px 4px;border-bottom:1px solid #e3ecef;cursor:pointer}.row b{font-size:11px}.row .meta{font-size:9px;color:#6d8592;margin-top:3px}.drawer{display:none;position:fixed;right:10px;bottom:10px;z-index:100;width:min(480px,calc(100vw - 20px));max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:15px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.drawer.open{display:block}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;background:#e9f1f5;font-size:9px;font-weight:900}.legend{font-size:9px;color:#637d8c;margin-top:8px}.key{display:inline-flex;gap:4px;align-items:center}.sw{width:11px;height:11px;border-radius:3px}.road{background:#737c84}.build{background:#ecd580}.park{background:#6da668}.private{background:#967397}.reserved{background:#55708d}@media(max-width:980px){.layout{grid-template-columns:1fr}.list{max-height:360px}}@media(max-width:650px){.app{padding:8px}.metrics{grid-template-columns:1fr 1fr}.tools{display:grid;grid-template-columns:1fr 1fr;width:100%}.search{grid-column:1/-1}.viewport{height:64vh;min-height:500px}.pname{display:none}.coord{font-size:7px}.top{flex-direction:column}.btn{min-height:42px}}
</style></head><body><div class="app"><header class="top"><div><h1>🗺️ Paojai City Planner</h1><div class="muted">Master City Layout v0.2 · พิกัด X000–X100 / Y000–Y100 · Planning Shadow เท่านั้น</div></div><div><button id="refresh" class="btn">↻ รีเฟรช</button></div></header><section class="metrics"><div class="metric"><b id="places">—</b><span>สถานที่</span></div><div class="metric"><b id="roads">—</b><span>ROAD</span></div><div class="metric"><b id="buildable">—</b><span>BUILDABLE</span></div><div class="metric"><b id="parks">—</b><span>PARK</span></div><div class="metric"><b id="private">—</b><span>PRIVATE</span></div><div class="metric"><b id="reserved">—</b><span>RESERVED</span></div></section><main class="layout"><section class="card"><div class="maphead"><div class="tools"><input id="search" class="search" placeholder="ค้นหาสถานที่ / พิกัด"><select id="zone" class="select"><option value="">ทุกโซน</option></select><button id="toggleLand" class="btn active">Land Use: เปิด</button><button id="toggleNames" class="btn">ชื่อ: Auto</button><button id="toggleCoords" class="btn">พิกัด: Auto</button></div><div class="zoomtools"><button id="out" class="btn">−</button><span id="zoomLabel" class="badge">100%</span><button id="in" class="btn">＋</button><button id="fit" class="btn">ภาพรวม</button></div></div><div id="viewport" class="viewport"><div id="map" class="map land-on"><div class="grid"></div></div></div><div class="legend"><span class="key"><i class="sw road"></i>ROAD</span><span class="key"><i class="sw build"></i>BUILDABLE</span><span class="key"><i class="sw park"></i>PARK</span><span class="key"><i class="sw private"></i>PRIVATE</span><span class="key"><i class="sw reserved"></i>RESERVED</span><span>แตะช่องเพื่อดูสิ่งที่อยู่ในพื้นที่</span></div></section><aside class="card"><h2 style="margin-top:0">📍 สารบัญเมือง</h2><div id="list" class="list"></div></aside></main></div><div id="drawer" class="drawer"><button id="close" class="btn">ปิด</button><div id="detail"></div></div><script>
const API='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/paojai-city-map-public-v1',Q=s=>document.querySelector(s),E=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let S={places:[],land_use_cells:[],health:{}},zoom=1,land=true,names='AUTO',coords='AUTO',BASE=900;
function filtered(){let s=Q('#search').value.trim().toLowerCase(),z=Q('#zone').value;return(S.places||[]).filter(p=>(!z||p.zone_key===z)&&(!s||[p.display_name_th,p.place_key,p.coordinate_label,p.zone_key,p.place_type].join(' ').toLowerCase().includes(s)))}
function axes(){for(let i=0;i<=100;i+=10){let x=document.createElement('span');x.className='axis x';x.style.left=`calc(${i}% - 6px)`;x.textContent='X'+String(i).padStart(3,'0');Q('#map').appendChild(x);let y=document.createElement('span');y.className='axis y';y.style.bottom=`calc(${i}% - 5px)`;y.textContent='Y'+String(i).padStart(3,'0');Q('#map').appendChild(y)}}
function renderCells(){(S.land_use_cells||[]).forEach(c=>{let d=document.createElement('div');d.className='cell '+c.land_use;d.style.left=(c.cell_x*10)+'%';d.style.bottom=(c.cell_y*10)+'%';d.innerHTML='<span class="celllabel">'+E(c.land_use)+'</span>';d.onclick=e=>{e.stopPropagation();cellDetail(c)};Q('#map').appendChild(d)})}
function cluster(arr){let sz=zoom<.9?20:zoom<1.3?12:7,m={};arr.forEach(p=>{let k=Math.round(p.grid_x/sz)+'-'+Math.round(p.grid_y/sz);(m[k]??=[]).push(p)});return zoom>=1.45?arr.map(x=>[x]):Object.values(m)}
function pin(p){let b=document.createElement('button');b.className='pin';b.style.left=p.grid_x+'%';b.style.bottom=p.grid_y+'%';b.innerHTML='<span class="dot"></span><span class="coord">'+E(p.coordinate_label)+'</span><span class="pname">'+E(p.display_name_th)+'</span>'+(p.total_presence?'<span class="occ">'+E(p.total_presence)+' คน</span>':'');b.onclick=e=>{e.stopPropagation();placeDetail(p)};Q('#map').appendChild(b)}
function clusterPin(g){let x=g.reduce((a,p)=>a+Number(p.grid_x),0)/g.length,y=g.reduce((a,p)=>a+Number(p.grid_y),0)/g.length,b=document.createElement('button');b.className='cluster';b.style.left=x+'%';b.style.bottom=y+'%';b.innerHTML='<span class="bubble">'+g.length+'</span>';b.onclick=e=>{e.stopPropagation();clusterDetail(g)};Q('#map').appendChild(b)}
function render(){let m=Q('#map');m.innerHTML='<div class="grid"></div>';m.style.width=Math.round(BASE*zoom)+'px';m.style.height=Math.round(BASE*zoom)+'px';m.classList.toggle('land-on',land);let autoNames=zoom>=1.35,autoCoords=zoom>=1.15;m.classList.toggle('hide-names',names==='OFF'||(names==='AUTO'&&!autoNames));m.classList.toggle('hide-coords',coords==='OFF'||(coords==='AUTO'&&!autoCoords));renderCells();axes();let arr=filtered();cluster(arr).forEach(g=>g.length===1?pin(g[0]):clusterPin(g));Q('#zoomLabel').textContent=Math.round(zoom*100)+'%';Q('#list').innerHTML=arr.slice().sort((a,b)=>a.coordinate_label.localeCompare(b.coordinate_label)).map(p=>'<div class="row" data-key="'+E(p.place_key)+'"><b>'+E(p.coordinate_label)+' · '+E(p.display_name_th)+'</b><div class="meta">'+E(p.zone_key)+' · '+E(p.place_type)+' · '+E(p.total_presence)+' คน</div></div>').join('');Q('#list').querySelectorAll('[data-key]').forEach(r=>r.onclick=()=>placeDetail(S.places.find(p=>p.place_key===r.dataset.key)))}
function placeDetail(p){if(!p)return;let cell=(S.land_use_cells||[]).find(c=>p.grid_x>=c.x_min&&p.grid_x<=c.x_max&&p.grid_y>=c.y_min&&p.grid_y<=c.y_max);Q('#detail').innerHTML='<h2>'+E(p.display_name_th)+'</h2><p><b>พิกัด:</b> '+E(p.coordinate_label)+'<br><b>Land Use:</b> '+E(cell?.land_use||'—')+'<br><b>โซน:</b> '+E(p.zone_key)+'<br><b>ประเภท:</b> '+E(p.place_type)+'<br><b>คนที่อยู่ตอนนี้:</b> '+E(p.total_presence)+'</p><p>'+E(p.purpose_th||'')+'</p><p class="muted">Planning Shadow · ยังไม่ควบคุม movement หรือ production</p>';Q('#drawer').classList.add('open')}
function cellDetail(c){let ps=(S.places||[]).filter(p=>(c.place_keys||[]).includes(p.place_key));Q('#detail').innerHTML='<h2>'+E(c.cell_key)+'</h2><p><b>ช่วงพิกัด:</b> X'+E(c.x_min)+'–'+E(c.x_max)+' / Y'+E(c.y_min)+'–'+E(c.y_max)+'<br><b>Land Use:</b> '+E(c.land_use)+'<br><b>สถานะ:</b> '+E(c.occupancy_state)+'<br><b>จำนวนสถานที่:</b> '+E(c.place_count)+'</p>'+(ps.length?ps.map(p=>'<div class="row"><b>'+E(p.coordinate_label)+' · '+E(p.display_name_th)+'</b></div>').join(''):'<p>ช่องนี้ยังว่าง</p>')+'<p class="muted">Road/land-use เป็นแผน Shadow เท่านั้น ยังไม่ย้ายอาคารหรือสั่งการเดินจริง</p>';Q('#drawer').classList.add('open')}
function clusterDetail(g){Q('#detail').innerHTML='<h2>กลุ่ม '+g.length+' จุด</h2>'+g.map(p=>'<div class="row" data-c="'+E(p.place_key)+'"><b>'+E(p.coordinate_label)+' · '+E(p.display_name_th)+'</b></div>').join('')+'<button id="zoomCluster" class="btn">＋ ซูมแยกจุด</button>';Q('#drawer').classList.add('open');Q('#detail').querySelectorAll('[data-c]').forEach(r=>r.onclick=()=>placeDetail(S.places.find(p=>p.place_key===r.dataset.c)));Q('#zoomCluster').onclick=()=>{Q('#drawer').classList.remove('open');setZoom(Math.max(1.5,zoom+.35))}}
function setZoom(z){let vp=Q('#viewport'),old=Q('#map').offsetWidth,rx=(vp.scrollLeft+vp.clientWidth/2)/Math.max(1,old),ry=(vp.scrollTop+vp.clientHeight/2)/Math.max(1,old);zoom=Math.max(.65,Math.min(1.8,z));render();requestAnimationFrame(()=>{vp.scrollLeft=Math.max(0,Q('#map').offsetWidth*rx-vp.clientWidth/2);vp.scrollTop=Math.max(0,Q('#map').offsetHeight*ry-vp.clientHeight/2)})}function fit(){let vp=Q('#viewport');setZoom(Math.max(.65,Math.min(1,vp.clientWidth/BASE)))}
async function load(){try{let r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!d.ok)throw 0;S=d;let cnt=t=>(d.land_use_cells||[]).filter(c=>c.land_use===t).length;Q('#places').textContent=d.places.length;Q('#roads').textContent=cnt('ROAD');Q('#buildable').textContent=cnt('BUILDABLE');Q('#parks').textContent=cnt('PARK');Q('#private').textContent=cnt('PRIVATE');Q('#reserved').textContent=cnt('RESERVED');let current=Q('#zone').value,z=[...new Set(d.places.map(p=>p.zone_key))].sort();Q('#zone').innerHTML='<option value="">ทุกโซน</option>'+z.map(v=>'<option '+(v===current?'selected':'')+'>'+E(v)+'</option>').join('');render()}catch(e){Q('#list').innerHTML='<div class="row">โหลดข้อมูลเมืองไม่สำเร็จ</div>'}}
Q('#search').oninput=render;Q('#zone').onchange=render;Q('#toggleLand').onclick=()=>{land=!land;Q('#toggleLand').classList.toggle('active',land);Q('#toggleLand').textContent='Land Use: '+(land?'เปิด':'ปิด');render()};Q('#toggleNames').onclick=()=>{names=names==='AUTO'?'ON':names==='ON'?'OFF':'AUTO';Q('#toggleNames').textContent='ชื่อ: '+({AUTO:'Auto',ON:'เปิด',OFF:'ปิด'}[names]);render()};Q('#toggleCoords').onclick=()=>{coords=coords==='AUTO'?'ON':coords==='ON'?'OFF':'AUTO';Q('#toggleCoords').textContent='พิกัด: '+({AUTO:'Auto',ON:'เปิด',OFF:'ปิด'}[coords]);render()};Q('#in').onclick=()=>setZoom(zoom+.2);Q('#out').onclick=()=>setZoom(zoom-.2);Q('#fit').onclick=fit;Q('#refresh').onclick=load;Q('#close').onclick=()=>Q('#drawer').classList.remove('open');load();setTimeout(()=>{if(innerWidth<650)fit()},300);setInterval(load,10000);
</script></body></html>
