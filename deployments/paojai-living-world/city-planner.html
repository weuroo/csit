<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf4f8">
<title>Paojai City Planner — Coordinate Map</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf5f2;color:#173044;font-family:ui-rounded,"SF Pro Rounded","Noto Sans Thai",system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.top h1{margin:0 0 4px}.muted{font-size:12px;color:#668296;line-height:1.5}.buttons,.tools{display:flex;gap:7px;flex-wrap:wrap}.btn,.select,.search{border:1px solid #cedde4;background:#fff;color:#173044;border-radius:12px;padding:9px 11px;font:inherit;text-decoration:none}.btn{cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.metric,.card{background:rgba(255,255,255,.96);border:1px solid #d7e5ea;border-radius:18px;padding:12px;box-shadow:0 7px 22px rgba(32,60,80,.07)}.metric b{display:block;font-size:21px}.metric span{font-size:10px;color:#6a8494}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}.mapcard{padding:10px}.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.mapwrap{position:relative;aspect-ratio:1/1;min-height:620px;background:#a8d985;border-radius:20px;overflow:hidden;border:1px solid #bfd2c0}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.28) 1px,transparent 1px);background-size:10% 10%;pointer-events:none;z-index:3}.axis{position:absolute;font-size:9px;font-weight:800;color:rgba(25,62,68,.6);z-index:4;pointer-events:none}.axis.x{bottom:2px}.axis.y{left:3px}.zone{position:absolute;border:2px dashed rgba(255,255,255,.68);border-radius:22px;background:rgba(255,255,255,.08);z-index:1;pointer-events:none}.zone span{position:absolute;left:8px;top:6px;font-size:9px;font-weight:900;color:rgba(31,72,68,.68)}.pin{position:absolute;transform:translate(-50%,-50%);z-index:10;border:0;background:transparent;cursor:pointer;padding:0}.dot{display:block;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #426b8a;box-shadow:0 3px 9px rgba(22,55,66,.25)}.pin.private .dot{border-color:#895f82}.pin.work .dot{border-color:#315b86}.pin.social .dot{border-color:#ad6d35}.pin.green .dot{border-color:#4d7d49}.pin.learning .dot{border-color:#5b68a7}.pin.creative .dot{border-color:#a75b78}.coord{position:absolute;left:50%;top:20px;transform:translateX(-50%);white-space:nowrap;background:rgba(20,45,56,.88);color:#fff;border-radius:8px;padding:2px 5px;font-size:8px;font-weight:900}.pname{position:absolute;left:50%;top:36px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.95);border:1px solid #d7e3e8;border-radius:8px;padding:3px 5px;font-size:8px;font-weight:800;max-width:170px;overflow:hidden;text-overflow:ellipsis}.occ{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);white-space:nowrap;background:#fff3b0;border-radius:8px;padding:2px 5px;font-size:8px;font-weight:900}.hide-names .pname{display:none}.hide-coords .coord{display:none}.list{max-height:750px;overflow:auto}.row{padding:9px 4px;border-bottom:1px solid #e4ecef;cursor:pointer}.row:hover{background:#f6fafb}.row b{font-size:12px}.row .meta{font-size:10px;color:#6c8491;margin-top:3px}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;background:#e9f1f5;font-size:9px;font-weight:900}.drawer{display:none;position:fixed;right:12px;bottom:12px;width:min(480px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:16px;z-index:100;box-shadow:0 24px 70px rgba(0,0,0,.28)}.drawer.open{display:block}.drawer h2{margin-top:8px}.person{padding:7px 0;border-bottom:1px solid #e6edf0;font-size:11px}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:#617c8c;margin-top:8px}.key{display:inline-flex;align-items:center;gap:4px}.key i{width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid #426b8a}.status{font-size:10px;color:#698292;margin-top:6px}@media(max-width:980px){.layout{grid-template-columns:1fr}.mapwrap{min-height:520px}.list{max-height:380px}}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.mapwrap{min-height:430px}.pname{display:none}.coord{font-size:7px}.top{flex-direction:column}.buttons{width:100%}.btn{flex:1;text-align:center}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1>🗺️ Paojai City Planner</h1><div class="muted">พิกัดมาตรฐานเมือง X000–X100 / Y000–Y100 · แสดงตำแหน่งสถานที่และจำนวน AI/NPC แบบ Live · Planning Preview เท่านั้น</div></div><div class="buttons"><a class="btn" href="./index.html">← Living World</a><button id="refresh" class="btn">↻ รีเฟรช</button></div></header>
<section class="metrics"><div class="metric"><b id="places">—</b><span>สถานที่มีพิกัด</span></div><div class="metric"><b id="missing">—</b><span>พิกัดที่ขาด</span></div><div class="metric"><b id="collisions">—</b><span>พิกัดชนกัน</span></div><div class="metric"><b id="ai">—</b><span>AI ในเมือง</span></div><div class="metric"><b id="npc">—</b><span>NPC ในเมือง</span></div></section>
<main class="layout">
<section class="card mapcard"><div class="maphead"><div class="tools"><input id="search" class="search" placeholder="ค้นหาสถานที่ / พิกัด"><select id="zone" class="select"><option value="">ทุกโซน</option></select><button id="toggleNames" class="btn">ชื่อ: เปิด</button><button id="toggleCoords" class="btn">พิกัด: เปิด</button></div><div id="generated" class="status"></div></div><div id="map" class="mapwrap"><div class="grid"></div></div><div class="legend"><span class="key"><i></i>ทั่วไป</span><span class="key">คลิกจุดเพื่อดูรายละเอียดและคนที่อยู่ตรงนั้น</span></div></section>
<aside class="card"><h2 style="margin-top:0">📍 สารบัญพิกัดเมือง</h2><div id="list" class="list"></div></aside>
</main>
</div>
<div id="drawer" class="drawer"><button id="close" class="btn">ปิด</button><div id="detail"></div></div>
<script>
const API='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/paojai-city-map-public-v1';
const Q=s=>document.querySelector(s),E=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let S={places:[],health:{}},names=true,coords=true;
const zoneBoxes={CIVIC_CENTER:[38,38,24,28,'🏙️ ศูนย์กลางเมือง'],LEARNING_QUARTER:[20,20,22,28,'📚 ย่านการเรียนรู้'],CREATIVE_QUARTER:[64,20,22,28,'🎨 ย่านสร้างสรรค์'],GREEN_BELT:[30,64,40,18,'🌿 Green Belt'],OPERATIONS_DISTRICT:[43,12,22,16,'🏢 ย่านปฏิบัติการ'],NPC_RESIDENTIAL:[2,4,96,92,'🏘️ ชุมชน NPC'],AI_RESIDENTIAL:[64,76,24,22,'🏡 บ้านพัก AI']};
function cls(p){if(p.place_type==='AI_PRIVATE_HOME'||p.place_type==='PRIVATE')return'private';if(p.place_type==='WORK_HUB'||p.place_type==='SECURITY')return'work';if(['SOCIAL','CIVIC'].includes(p.place_type))return'social';if(['RECOVERY','REST'].includes(p.place_type))return'green';if(['LEARNING','KNOWLEDGE','OBSERVATION'].includes(p.place_type))return'learning';if(['CREATIVE','CREATE','PLAY'].includes(p.place_type))return'creative';return''}
function filtered(){let s=Q('#search').value.trim().toLowerCase(),z=Q('#zone').value;return(S.places||[]).filter(p=>(!z||p.zone_key===z)&&(!s||[p.display_name_th,p.place_key,p.coordinate_label,p.zone_key,p.place_type].join(' ').toLowerCase().includes(s)))}
function renderZones(){Object.entries(zoneBoxes).forEach(([k,v])=>{let d=document.createElement('div');d.className='zone';d.style.left=v[0]+'%';d.style.bottom=v[1]+'%';d.style.width=v[2]+'%';d.style.height=v[3]+'%';d.innerHTML='<span>'+E(v[4])+'</span>';Q('#map').appendChild(d)});for(let i=0;i<=100;i+=10){let x=document.createElement('span');x.className='axis x';x.style.left=`calc(${i}% - 6px)`;x.textContent='X'+String(i).padStart(3,'0');Q('#map').appendChild(x);let y=document.createElement('span');y.className='axis y';y.style.bottom=`calc(${i}% - 5px)`;y.textContent='Y'+String(i).padStart(3,'0');Q('#map').appendChild(y)}}
function render(){let m=Q('#map');m.innerHTML='<div class="grid"></div>';m.classList.toggle('hide-names',!names);m.classList.toggle('hide-coords',!coords);renderZones();let arr=filtered();arr.forEach(p=>{let b=document.createElement('button');b.className='pin '+cls(p);b.style.left=p.grid_x+'%';b.style.bottom=p.grid_y+'%';b.title=p.coordinate_label+' · '+p.display_name_th;b.innerHTML='<span class="dot"></span><span class="coord">'+E(p.coordinate_label)+'</span><span class="pname">'+E(p.display_name_th)+'</span>'+(p.total_presence?'<span class="occ">'+E(p.total_presence)+' คน</span>':'');b.onclick=()=>detail(p);m.appendChild(b)});Q('#list').innerHTML=arr.sort((a,b)=>a.zone_key.localeCompare(b.zone_key)||b.grid_y-a.grid_y||a.grid_x-b.grid_x).map(p=>'<div class="row" data-key="'+E(p.place_key)+'"><b>'+E(p.coordinate_label)+' · '+E(p.display_name_th)+'</b><div class="meta">'+E(p.zone_key)+' · '+E(p.place_type)+' · AI '+E(p.ai_count)+' / NPC '+E(p.npc_count)+'</div></div>').join('')||'<div class="row">ไม่พบตำแหน่ง</div>';Q('#list').querySelectorAll('[data-key]').forEach(r=>r.onclick=()=>detail(S.places.find(p=>p.place_key===r.dataset.key)))}
function detail(p){if(!p)return;let people=[...(p.ai_present||[]).map(x=>'<div class="person"><span class="badge">AI</span> '+E(x.display_name_th||x.identity_key)+'</div>'),...(p.npc_present||[]).map(x=>'<div class="person"><span class="badge">NPC</span> '+E(x.display_name_th||x.npc_key)+'</div>')].join('');Q('#detail').innerHTML='<h2>'+E(p.display_name_th)+'</h2><p><b>พิกัด:</b> '+E(p.coordinate_label)+'<br><b>Grid:</b> X='+E(p.grid_x)+', Y='+E(p.grid_y)+'<br><b>โซน:</b> '+E(p.zone_key)+'<br><b>ประเภท:</b> '+E(p.place_type)+'</p><p>'+E(p.purpose_th||'')+'</p><h3>คนที่อยู่ตรงนี้ตอนนี้ ('+E(p.total_presence)+')</h3>'+(people||'<div class="person">ไม่มี AI/NPC อยู่ที่พิกัดนี้ตอนนี้</div>')+'<p class="muted">พิกัดชุดนี้เป็น City Planning Shadow ยังไม่ใช้สั่ง movement อัตโนมัติ</p>';Q('#drawer').classList.add('open')}
async function load(){Q('#generated').textContent='กำลังโหลด…';try{let r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!d.ok)throw 0;S=d;let h=d.health||{};Q('#places').textContent=h.coordinated_places??d.places.length;Q('#missing').textContent=h.missing_coordinates??'—';Q('#collisions').textContent=h.coordinate_collisions??'—';Q('#ai').textContent=(d.places||[]).reduce((a,p)=>a+(p.ai_count||0),0);Q('#npc').textContent=(d.places||[]).reduce((a,p)=>a+(p.npc_count||0),0);Q('#generated').textContent='อัปเดต '+new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(d.generated_at));let zones=[...new Set(d.places.map(p=>p.zone_key))].sort();Q('#zone').innerHTML='<option value="">ทุกโซน</option>'+zones.map(z=>'<option>'+E(z)+'</option>').join('');render()}catch(e){Q('#generated').textContent='โหลดพิกัดไม่สำเร็จ'}}
Q('#search').oninput=render;Q('#zone').onchange=render;Q('#toggleNames').onclick=()=>{names=!names;Q('#toggleNames').textContent='ชื่อ: '+(names?'เปิด':'ปิด');render()};Q('#toggleCoords').onclick=()=>{coords=!coords;Q('#toggleCoords').textContent='พิกัด: '+(coords?'เปิด':'ปิด');render()};Q('#refresh').onclick=load;Q('#close').onclick=()=>Q('#drawer').classList.remove('open');load();setInterval(load,10000);
</script>
</body></html>
