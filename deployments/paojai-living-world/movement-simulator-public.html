<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paojai Movement Simulator</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5f2;color:#173044;font-family:system-ui,"Noto Sans Thai",sans-serif}.app{max-width:1200px;margin:auto;padding:10px}.card,.metric{background:#fff;border:1px solid #d8e6ea;border-radius:16px;padding:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.metric b{font-size:20px;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn,select{padding:10px;border-radius:10px;border:1px solid #cfdde4;background:#fff;color:#173044}.btn{cursor:pointer}.btn.primary{background:#173044;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px}.map{position:relative;width:900px;height:900px;background:#a8d985}.viewport{overflow:auto;height:66vh;min-height:480px;border-radius:14px;background:#b9dca2}.grid{position:absolute;inset:0;background-image:linear-gradient(to right,#ffffff55 1px,transparent 1px),linear-gradient(to bottom,#ffffff55 1px,transparent 1px);background-size:10% 10%;pointer-events:none}.cell{position:absolute;width:10%;height:10%;border:1px solid #ffffff22}.cell.ROAD{background:#737c8466}.cell.PARK{background:#6da66855}.cell.PRIVATE{background:#96739755}.cell.RESERVED{background:#55708d55}.path{position:absolute;width:10%;height:10%;background:#3784ca55;outline:3px solid #3784caaa;outline-offset:-4px}.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #426b8a;transform:translate(-50%,-50%)}.sim{position:absolute;width:28px;height:28px;border-radius:50%;background:#173044;color:#fff;border:3px solid #fff;display:grid;place-items:center;transform:translate(-50%,-50%);z-index:9}.event{font-size:11px;padding:7px 0;border-bottom:1px solid #e4ecef}.good{color:#247047}.bad{color:#a64242}.muted{font-size:11px;color:#688392}@media(max-width:800px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.controls{display:grid;grid-template-columns:1fr 1fr}.controls select:first-child{grid-column:1/-1}.map{width:760px;height:760px}}</style></head><body><div class="app"><h1>🚶 Paojai Movement Simulator</h1><div class="muted">Public-safe · Shadow Preview · read-only · ไม่เขียนตำแหน่งจริง ไม่ส่งข้อความ ไม่สร้าง memory/authority/production effect</div><div class="metrics"><div class="metric"><b id="actors">—</b><span>AI + NPC</span></div><div class="metric"><b id="nodes">—</b><span>Transit Nodes</span></div><div class="metric"><b id="edges">—</b><span>Walking Edges</span></div><div class="metric"><b id="state">LOADING</b><span>State</span></div></div><div class="layout"><section class="card"><div class="controls"><select id="actor"></select><select id="dest"></select><select id="speed"><option value="650">ปกติ</option><option value="350">เร็ว</option><option value="1000">ช้า</option></select><button class="btn primary" id="run">▶ ทดลองเดิน</button><button class="btn" id="regress">🧪 ทดสอบทั้งระบบ</button><button class="btn" id="stop">■ หยุด</button></div><p id="status" class="muted">กำลังโหลด…</p><div class="viewport"><div id="map" class="map"><div class="grid"></div></div></div><div id="reg" class="muted" style="margin-top:8px">ยังไม่ได้รัน regression</div></section><aside class="card"><h3>Timeline Preview</h3><div id="timeline" class="muted">ยังไม่มี simulation</div></aside></div></div><script>const API='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/paojai-city-map-public-v1',q=s=>document.querySelector(s);let S={},A=[],route=[],timer=null,idx=0;function pname(k){return(S.places||[]).find(p=>p.place_key===k)?.display_name_th||k}function home(a){return a?.type==='AI'?(S.ai_home_map||[]).find(h=>h.identity_key===a.key)?.home_key:null}function priv(k){return(S.private_residential_access||[]).some(x=>x.place_key===k)}function actor(){return A.find(a=>a.id===q('#actor').value)}function allowed(a,p){return !priv(p.place_key)||(a.type==='AI'&&home(a)===p.place_key)}function access(k){let pa=(S.place_access||[]).find(x=>x.place_key===k),pr=(S.private_residential_access||[]).find(x=>x.place_key===k);return pr?.public_graph_cell_key||pa?.access_cell_key||null}function bfs(f,t){let st=access(f),go=access(t);if(!st||!go)return[];let adj=new Map;for(let e of S.walking_edges||[]){if(!adj.has(e.from_node))adj.set(e.from_node,[]);adj.get(e.from_node).push(e.to_node)}let qq=[st],prev=new Map([[st,null]]),i=0;while(i<qq.length&&qq.length<=200){let u=qq[i++];if(u===go)break;for(let v of adj.get(u)||[])if(!prev.has(v)){prev.set(v,u);qq.push(v)}}if(!prev.has(go))return[];let o=[],x=go;while(x){o.push(x);x=prev.get(x)}return o.reverse()}function draw(mark=null){let m=q('#map');m.innerHTML='<div class="grid"></div>';for(let c of S.land_use_cells||[]){let d=document.createElement('div');d.className='cell '+c.land_use;d.style.left=c.cell_x*10+'%';d.style.bottom=c.cell_y*10+'%';m.appendChild(d)}let nm=new Map((S.walking_nodes||[]).map(n=>[n.cell_key,n]));for(let k of route){let n=nm.get(k);if(!n)continue;let d=document.createElement('div');d.className='path';d.style.left=n.cell_x*10+'%';d.style.bottom=n.cell_y*10+'%';m.appendChild(d)}for(let p of S.places||[]){let d=document.createElement('div');d.className='pin';d.style.left=p.grid_x+'%';d.style.bottom=p.grid_y+'%';d.title=p.display_name_th;m.appendChild(d)}if(mark&&nm.get(mark)){let n=nm.get(mark),d=document.createElement('div');d.className='sim';d.style.left=(n.cell_x*10+5)+'%';d.style.bottom=(n.cell_y*10+5)+'%';d.textContent=actor()?.type==='AI'?'AI':'N';m.appendChild(d)}}function refreshDest(){let a=actor();q('#dest').innerHTML='<option value="">เลือกปลายทาง</option>'+(S.places||[]).filter(p=>a&&p.place_key!==a.place&&allowed(a,p)).sort((x,y)=>x.display_name_th.localeCompare(y.display_name_th,'th')).map(p=>'<option value="'+p.place_key+'">'+p.display_name_th+(priv(p.place_key)?' · 🔒 บ้านของตัวเอง':'')+'</option>').join('')}function check(a,d,r){let loop=new Set(r).size!==r.length,unauth=priv(d)&&!(a.type==='AI'&&home(a)===d),dead=!r.length;return{loop,unauth,dead,ok:!loop&&!unauth&&!dead}}function run(){clearInterval(timer);let a=actor(),d=q('#dest').value;if(!a||!d)return;q('#state').textContent='TESTING';route=bfs(a.place,d);let c=check(a,d,route);q('#timeline').innerHTML='<div class="event"><b>'+a.name+'</b><br>'+pname(a.place)+' → '+pname(d)+'</div>'+route.map((k,i)=>'<div class="event">Step '+(i+1)+' · '+k+'</div>').join('')+'<div class="event '+(c.ok?'good':'bad')+'">'+(c.ok?'PASS':'BLOCK')+'</div>';if(!c.ok){q('#status').textContent='BLOCKED: route ไม่ผ่าน safety check';q('#state').textContent='BLOCKED';draw();return}idx=0;draw(route[0]);q('#status').textContent='กำลังจำลอง '+route.length+' steps';timer=setInterval(()=>{idx++;if(idx>=route.length){clearInterval(timer);q('#state').textContent='PREVIEW_DONE';q('#status').textContent='จบ preview — ไม่มีตำแหน่งจริงถูกเปลี่ยน';draw(route[route.length-1]);return}draw(route[idx])},Number(q('#speed').value))}function regression(){clearInterval(timer);let anchors=['CENTRAL_SQUARE','AI_CAFE','QUIET_PARK'].filter(k=>(S.places||[]).some(p=>p.place_key===k));let cases=0,dead=0,loop=0,unauth=0;for(let a of A){let tests=[...anchors];if(a.type==='AI'&&home(a))tests.push(home(a));for(let d of tests){let p=(S.places||[]).find(x=>x.place_key===d);if(!p||d===a.place||!allowed(a,p))continue;cases++;let c=check(a,d,bfs(a.place,d));dead+=c.dead?1:0;loop+=c.loop?1:0;unauth+=c.unauth?1:0}}let bad=dead+loop+unauth;q('#reg').innerHTML='<b class="'+(bad?'bad':'good')+'">'+(bad?'REGRESSION BLOCKED':'REGRESSION PASS')+'</b> · Cases '+cases+' · No route '+dead+' · Loop '+loop+' · Unauthorized private '+unauth;q('#state').textContent=bad?'BLOCKED':'STABILIZING'}async function load(){try{let r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!d.ok)throw 0;S=d;A=[];for(let p of d.places||[]){for(let x of p.ai_present||[])A.push({id:'AI:'+x.identity_key,type:'AI',key:x.identity_key,name:x.display_name_th,place:p.place_key});for(let x of p.npc_present||[])A.push({id:'NPC:'+x.npc_key,type:'NPC',key:x.npc_key,name:x.display_name_th,place:p.place_key})}q('#actors').textContent=A.length;q('#nodes').textContent=(d.walking_nodes||[]).length;q('#edges').textContent=(d.walking_edges||[]).length;q('#actor').innerHTML=A.map(a=>'<option value="'+a.id+'">'+(a.type==='AI'?'🤖 ':'👤 ')+a.name+' · '+pname(a.place)+'</option>').join('');refreshDest();draw();q('#state').textContent='READY';q('#status').textContent='พร้อมใช้งาน · Public-safe read-only'}catch(e){q('#state').textContent='DEGRADED';q('#status').textContent='โหลดข้อมูลไม่สำเร็จ'}}q('#actor').onchange=refreshDest;q('#run').onclick=run;q('#regress').onclick=regression;q('#stop').onclick=()=>{clearInterval(timer);q('#state').textContent='READY';q('#status').textContent='หยุด simulation แล้ว';draw()};load();</script></body></html>
