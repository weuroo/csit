function showCityInfo(){let c=D.c||{};$('#st').textContent='🏙️ City Info';$('#sm').textContent='Public-Safe + Shadow Simulation';$('#sb').innerHTML=`<div class="event"><b>${actors.filter(x=>x.t==='AI').length}</b> AI</div><div class="event"><b>${actors.filter(x=>x.t==='NPC').length}</b> NPC</div><div class="event"><b>${P.size}</b> สถานที่</div><div class="event"><b>${(c.walking_edges||[]).length}</b> Walking Edges</div><div class="note"><b>Renderer v2</b><br>ซ่อน technical grid · occupancy spacing · building variants · semantic zoom · smooth camera · route-based movement</div>`;openSheet()}
function search(q){q=q.trim().toLowerCase();if(!q){$('#results').classList.remove('on');return}let r=[];for(const a of actors)if((a.n+' '+a.k).toLowerCase().includes(q))r.push({t:'a',id:a.id,n:(a.t==='AI'?'🤖 ':'👤 ')+a.n,m:a.t});for(const p of P.values())if(((p.display_name_th||'')+' '+p.place_key).toLowerCase().includes(q))r.push({t:'p',id:p.place_key,n:(glyph(kind(p))||'🏡')+' '+(p.display_name_th||p.place_key),m:p.place_type});$('#results').innerHTML=r.slice(0,24).map(x=>`<button class="result" data-t="${x.t}" data-id="${esc(x.id)}"><b>${esc(x.n)}</b><small>${esc(x.m||'')}</small></button>`).join('');$('#results').classList.add('on');$$('#results [data-t]').forEach(b=>b.onclick=()=>{$('#results').classList.remove('on');$('#searchbar').classList.remove('on');b.dataset.t==='a'?showActor(b.dataset.id):showPlace(b.dataset.id)})}
function regression(){let cases=0,bad=0,anchors=[...P.values()].filter(p=>['social','learn','wellness','civic'].includes(kind(p))).slice(0,6);for(const a of actors.slice(0,80))for(const p of anchors)if(allowed(a,p)&&p.place_key!==a.place){cases++;let r=bfs(a.place,p.place_key);if(!r.length||new Set(r).size!==r.length)bad++}pulse(`Route regression ${bad?'BLOCK':'PASS'} · ${cases} cases · ${bad} failures`,bad?'BLOCK':'PASS')}
function bind(){$('#plus').onclick=()=>zoom(1.25);$('#minus').onclick=()=>zoom(.8);$('#fit').onclick=fit;$('#searchBtn').onclick=()=>{$('#searchbar').classList.toggle('on');if($('#searchbar').classList.contains('on'))$('#q').focus()};$('#searchClose').onclick=()=>{$('#searchbar').classList.remove('on');$('#results').classList.remove('on');$('#q').value=''};$('#q').oninput=e=>search(e.target.value);$('#infoBtn').onclick=showCityInfo;$('#pulseBtn').onclick=()=>$('#pulse').classList.toggle('on');$('#close').onclick=closeSheet;$('#sheetbg').onclick=e=>{if(e.target===$('#sheetbg'))closeSheet()};$$('[data-s]').forEach(b=>b.onclick=()=>{let n=simNow();epoch=Date.now();offset=n-epoch;speed=+b.dataset.s;$$('[data-s]').forEach(x=>x.classList.toggle('on',x===b));pulse(speed?'Simulation speed '+speed+'×':'Simulation paused','SYSTEM')});let v=$('#view');v.onpointerdown=e=>{if(e.target.closest('button'))return;v.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY})};v.onpointermove=e=>{if(!ptr.has(e.pointerId))return;follow=null;let old=ptr.get(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});let ps=[...ptr.values()];if(ps.length===1){cam.tx+=e.clientX-old.x;cam.ty+=e.clientY-old.y}else if(ps.length===2){let[a,b]=ps,d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},r=v.getBoundingClientRect();if(lastDist)zoom(d/lastDist,m.x-r.left,m.y-r.top);lastDist=d}};let end=e=>{ptr.delete(e.pointerId);if(ptr.size<2)lastDist=0};v.onpointerup=end;v.onpointercancel=end;v.addEventListener('wheel',e=>{e.preventDefault();let r=v.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});window.onresize=()=>{if(innerWidth<800)experience()}}
function frame(t){if(ready){timeState();if(t-lastTick>70){tick(simNow());lastTick=t}if(follow){let a=actors.find(x=>x.id===follow);if(a){let r=$('#view').getBoundingClientRect();cam.ts=Math.max(cam.ts,1.55);cam.tx=r.width/2-a.x*cam.ts;cam.ty=r.height/2-a.y*cam.ts}}}applyCam();requestAnimationFrame(frame)}
async function load(){try{let[wr,cr]=await Promise.all([fetch(WA+'?days=14',{cache:'no-store'}),fetch(CA,{cache:'no-store'})]),[w,c]=await Promise.all([wr.json(),cr.json()]);if(!w.ok||!c.ok||!w.public_safe||!c.public_safe)throw new Error('unsafe/degraded source');D={w,c};renderDistricts();buildGraph();renderRoads();renderDecor();renderPlaces();buildActors();for(const e of (w.inner_life||[]).slice(0,5).reverse())pulse((e.display_name_th||e.identity_key)+' · '+(e.title_th||e.event_type),'FACT',Date.parse(e.occurred_at||new Date()));regression();experience();ready=true;pulse(`Living City v2 พร้อม · ${actors.length} actors · ${P.size} places`,'READY')}catch(e){console.error(e);$('#error').classList.add('on')}}
bind();requestAnimationFrame(frame);load();setInterval(()=>{if(ready)fetch(WA+'?days=14',{cache:'no-store'}).then(r=>r.json()).then(w=>{if(w.ok&&w.public_safe)D.w=w}).catch(()=>{})},30000);
</script>
