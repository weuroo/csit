<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Mission Control Owner Auth</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#eef7ff;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#0d1a2c;border:1px solid #20334a;border-radius:24px;padding:26px}.ey{color:#73d8ff;letter-spacing:.16em;font-size:12px;font-weight:800;text-transform:uppercase}h1{font-size:34px;margin:10px 0}p{color:#a7b7ca;line-height:1.6}button{width:100%;min-height:56px;border:0;border-radius:16px;background:#eef7ff;color:#07111f;font-size:18px;font-weight:800;margin-top:14px}.st{margin-top:18px;min-height:46px;color:#a7b7ca;white-space:pre-wrap}.ok{color:#6ee7b7}.err{color:#fda4af}.small{font-size:12px;color:#6f8298;margin-top:18px}</style></head>
<body><main class="card"><div class="ey">Sovereign Owner Security Root</div><h1>ยืนยันเพื่อเข้า Mission Control</h1><p>ใช้ Passkey / Face ID ของ Owner เดิมเพื่อออกสิทธิ์อ่าน Mission Control เท่านั้น ไม่มีสิทธิ์แก้ไข Production</p><button id="go">ยืนยันด้วย Face ID</button><div id="st" class="st"></div><div class="small">One-time authorization · 60s code · read-only session</div></main>
<script type="module">
import { startAuthentication } from 'https://esm.sh/@simplewebauthn/browser@13';
const API='https://bvnmwfhqgdevupvcqqyl.supabase.co/functions/v1/pm-owner-mission-auth';
const q=new URLSearchParams(location.search),requestId=q.get('request'),state=q.get('state'),btn=document.getElementById('go'),st=document.getElementById('st');
const set=(t,c='')=>{st.textContent=t;st.className='st '+c};
async function post(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d?.ok===false)throw new Error(d?.error||`HTTP_${r.status}`);return d}
btn.onclick=async()=>{try{btn.disabled=true;if(!requestId||!state)throw new Error('AUTH_REQUEST_MISSING');set('กำลังขอ one-time challenge…');const o=await post({action:'options',requestId,state});set('กรุณายืนยัน Face ID / Passkey…');const credential=await startAuthentication({optionsJSON:o.options});set('กำลังตรวจ Owner Security Root…');const v=await post({action:'verify',requestId,state,credential});if(!v?.verified||!v?.redirectUrl)throw new Error('OWNER_AUTH_NOT_CONFIRMED');set('✅ ยืนยัน Owner สำเร็จ กำลังกลับ Mission Control','ok');location.replace(v.redirectUrl)}catch(e){btn.disabled=false;set('ไม่สำเร็จ: '+(e?.message||String(e)),'err')}};
</script></body></html>
