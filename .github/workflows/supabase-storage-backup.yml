name: Supabase Storage Backup (Fail-Closed)

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: Supabase Storage bucket to export
        required: true
        default: pm-line-evidence
      expected_object_count:
        description: Expected object count from live evidence
        required: true
        default: '712'
      expected_total_bytes:
        description: Expected total bytes from live evidence
        required: true
        default: '769369808'

permissions:
  contents: read

env:
  PROJECT_REF: bvnmwfhqgdevupvcqqyl
  STORAGE_BACKUP_DIR: storage-backup-output

jobs:
  export-storage:
    name: Encrypted Storage object-byte backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Safety gate — required secrets and scope
        shell: bash
        env:
          SUPABASE_BACKUP_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SECRET_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_BACKUP_SECRET_KEY:-}" ]]; then
            echo "::error::Missing SUPABASE_BACKUP_SECRET_KEY. No Storage download was attempted."
            exit 20
          fi
          if [[ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]]; then
            echo "::error::Missing BACKUP_ENCRYPTION_PASSPHRASE. No Storage download was attempted."
            exit 21
          fi
          if [[ "${{ inputs.bucket }}" != "pm-line-evidence" ]]; then
            echo "::error::Requested bucket is outside the currently approved backup scope. Fail closed."
            exit 22
          fi

      - name: Prepare downloader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STORAGE_BACKUP_DIR/plain/objects"
          npm init -y >/dev/null 2>&1
          npm install --silent @supabase/supabase-js@2

      - name: Download private Storage objects and verify stable listing
        shell: bash
        env:
          SUPABASE_BACKUP_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SECRET_KEY }}
          BUCKET: ${{ inputs.bucket }}
          EXPECTED_COUNT: ${{ inputs.expected_object_count }}
          EXPECTED_BYTES: ${{ inputs.expected_total_bytes }}
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/storage-backup.mjs <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          import fs from 'node:fs/promises'
          import path from 'node:path'
          import crypto from 'node:crypto'

          const projectRef = process.env.PROJECT_REF
          const key = process.env.SUPABASE_BACKUP_SECRET_KEY
          const bucket = process.env.BUCKET
          const expectedCount = Number(process.env.EXPECTED_COUNT)
          const expectedBytes = Number(process.env.EXPECTED_BYTES)
          const root = path.resolve(process.env.STORAGE_BACKUP_DIR, 'plain')
          const objectsDir = path.join(root, 'objects')
          const supabase = createClient(`https://${projectRef}.supabase.co`, key, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
          })

          async function listDir(prefix = '') {
            const out = []
            let offset = 0
            const limit = 1000
            while (true) {
              const { data, error } = await supabase.storage.from(bucket).list(prefix, {
                limit,
                offset,
                sortBy: { column: 'name', order: 'asc' }
              })
              if (error) throw new Error(`Storage list failed at prefix depth ${prefix.split('/').filter(Boolean).length}: ${error.message}`)
              for (const item of data || []) {
                const full = prefix ? `${prefix}/${item.name}` : item.name
                if (item.id == null && item.metadata == null) {
                  out.push(...await listDir(full))
                } else {
                  out.push({
                    name: full,
                    size: Number(item.metadata?.size ?? 0),
                    updated_at: item.updated_at ?? null,
                    content_type: item.metadata?.mimetype ?? null
                  })
                }
              }
              if (!data || data.length < limit) break
              offset += limit
            }
            return out
          }

          function stableSort(items) {
            return [...items].sort((a,b) => a.name.localeCompare(b.name, 'en'))
          }

          function listingFingerprint(items) {
            const canonical = stableSort(items).map(x => `${x.name}\t${x.size}\t${x.updated_at ?? ''}`).join('\n')
            return crypto.createHash('sha256').update(canonical).digest('hex')
          }

          const before = stableSort(await listDir(''))
          const listedBytes = before.reduce((sum, x) => sum + x.size, 0)
          if (before.length !== expectedCount) throw new Error(`Object count changed: live-list=${before.length}, expected=${expectedCount}`)
          if (listedBytes !== expectedBytes) throw new Error(`Storage bytes changed: live-list=${listedBytes}, expected=${expectedBytes}`)
          const beforeFp = listingFingerprint(before)

          const manifest = []
          let downloadedBytes = 0
          for (let i = 0; i < before.length; i++) {
            const obj = before[i]
            const { data, error } = await supabase.storage.from(bucket).download(obj.name)
            if (error) throw new Error(`Object download failed at item ${i + 1}/${before.length}: ${error.message}`)
            const buf = Buffer.from(await data.arrayBuffer())
            if (buf.length !== obj.size) throw new Error(`Object size changed during backup at item ${i + 1}/${before.length}`)
            const contentSha = crypto.createHash('sha256').update(buf).digest('hex')
            const pathSha = crypto.createHash('sha256').update(obj.name, 'utf8').digest('hex')
            const blobName = `${pathSha}.bin`
            await fs.writeFile(path.join(objectsDir, blobName), buf, { mode: 0o600 })
            manifest.push({
              bucket,
              path: obj.name,
              blob: `objects/${blobName}`,
              size: buf.length,
              sha256: contentSha,
              updated_at: obj.updated_at,
              content_type: obj.content_type
            })
            downloadedBytes += buf.length
            if ((i + 1) % 50 === 0 || i + 1 === before.length) {
              console.log(`Downloaded ${i + 1}/${before.length} objects (${downloadedBytes} bytes).`)
            }
          }

          const after = stableSort(await listDir(''))
          const afterBytes = after.reduce((sum, x) => sum + x.size, 0)
          const afterFp = listingFingerprint(after)
          if (after.length !== before.length || afterBytes !== listedBytes || afterFp !== beforeFp) {
            throw new Error('Storage listing changed during backup window. Fail closed; discard this run and retry later.')
          }
          if (downloadedBytes !== expectedBytes) throw new Error(`Downloaded byte total mismatch: ${downloadedBytes} vs expected ${expectedBytes}`)

          const manifestDoc = {
            format: 'pm-agency-supabase-storage-backup-v1',
            project_ref: projectRef,
            bucket,
            created_utc: new Date().toISOString(),
            object_count: manifest.length,
            total_bytes: downloadedBytes,
            stable_listing_sha256: beforeFp,
            objects: manifest
          }
          await fs.writeFile(path.join(root, 'STORAGE_MANIFEST.json'), JSON.stringify(manifestDoc, null, 2), { mode: 0o600 })
          const manifestSha = crypto.createHash('sha256').update(await fs.readFile(path.join(root, 'STORAGE_MANIFEST.json'))).digest('hex')
          await fs.writeFile(path.join(root, 'STORAGE_MANIFEST.sha256'), `${manifestSha}  STORAGE_MANIFEST.json\n`, { mode: 0o600 })
          console.log(`Storage capture verified: objects=${manifest.length}, bytes=${downloadedBytes}, stable listing=yes.`)
          NODE
          node /tmp/storage-backup.mjs

      - name: Encrypt Storage backup bundle
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          set -euo pipefail
          umask 077
          tar -C "$STORAGE_BACKUP_DIR/plain" -czf "$STORAGE_BACKUP_DIR/storage-${BUCKET}.tar.gz" .
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$STORAGE_BACKUP_DIR/storage-${BUCKET}.tar.gz.gpg" "$STORAGE_BACKUP_DIR/storage-${BUCKET}.tar.gz"
          sha256sum "$STORAGE_BACKUP_DIR/storage-${BUCKET}.tar.gz.gpg" > "$STORAGE_BACKUP_DIR/ARTIFACT_SHA256SUMS"
          rm -rf "$STORAGE_BACKUP_DIR/plain" "$STORAGE_BACKUP_DIR/storage-${BUCKET}.tar.gz"
          rm -f /tmp/storage-backup.mjs

      - name: Upload encrypted Storage artifact only
        uses: actions/upload-artifact@v4
        with:
          name: supabase-storage-${{ inputs.bucket }}-${{ github.run_id }}
          path: |
            storage-backup-output/storage-${{ inputs.bucket }}.tar.gz.gpg
            storage-backup-output/ARTIFACT_SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Confirm no plaintext remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -d "$STORAGE_BACKUP_DIR/plain"
          test ! -f "$STORAGE_BACKUP_DIR/storage-${{ inputs.bucket }}.tar.gz"
          test ! -f /tmp/storage-backup.mjs
          echo "Encrypted Storage backup artifact created; plaintext removed from runner workspace."
